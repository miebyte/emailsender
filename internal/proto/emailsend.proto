syntax = "proto3";

option go_package = "github.com/miebyte/emailsender/api/grpc/emailsendpb;emailsendpb";


service EmailSender {
	rpc Send(SendEmailRequest) returns (SendEmailResponse) {}
	rpc SendAsync(SendEmailRequest) returns (SendEmailResponse) {}
}

message SendEmailRequest {
	string from = 1;
	string to = 2;
	string subject = 3;
	string body = 4;
}

message SendEmailResponse {
}
