syntax = "proto3";

option go_package = "gitea.hoven.com/core/emailsender/api/emailsendpb;emailsendpb";


service EmailSender {
	rpc SendEmail(SendEmailRequest) returns (SendEmailResponse) {}
}

message SendEmailRequest {
	string from = 1;
	string to = 2;
	string subject = 3;
	string body = 4;
}

message SendEmailResponse {
}
