version: '3.8'
services:
  emailsender:
    build: .
    environment:
      - GO_PUZZLE_SERVICE=email-sender:${VERSION}
    image: ${IMAGE}:${VERSION}
      # restart: always
    container_name: email-sender
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: host
    command:
      - ./server
      - --useRemoteConfig
    logging:
      options:
        max-size: 100m
        max-file: 5
